name: ridin
description: "Ridin - Real-Time School Bus Tracking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & Real-Time
  dio: ^5.9.0
  centrifuge: ^0.15.0
  web_socket_channel: ^3.0.3

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # OpenStreetMap Mapping
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Location & Background Service
  geolocator: ^14.0.2
  flutter_background_service: ^5.1.0
  permission_handler: ^11.4.0
  wakelock_plus: ^1.4.0

  # Storage & Local Cache
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Localization & Fonts
  easy_localization: ^3.0.8
  intl: ^0.20.2
  google_fonts: ^7.1.0

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Hardware & Scanner
  mobile_scanner: ^6.0.4
  url_launcher: ^6.3.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
